services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: erp_app
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-erp_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?Renseignez JWT_SECRET dans .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Renseignez FIELD_ENCRYPTION_KEY dans .env}
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-1440}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-50mb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      ITAD_API_KEY: ${ITAD_API_KEY:-}
    volumes:
      - app_backups:/app/backups
      - pdf_plugin_data:/app/data/pdf-plugin
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4000}:4000"
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_backups:
  pdf_plugin_data:

networks:
  erp_network:
    driver: bridge
